name: Node.js

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  env:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm test

  prettier:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        prettier-version: [2.3.0, latest, next]

    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm install prettier@${{ matrix.prettier-version }}

  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx prettier --check .
